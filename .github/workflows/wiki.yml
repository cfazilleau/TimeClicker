name: Wiki

# Copies wiki/ to the repository's wiki tab, which GitHub keeps in its own git repository (TimeClicker.wiki.git).
# wiki/ is the source: edits made on the wiki are overwritten by the next sync.
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Clone the wiki
        env:
          TOKEN: ${{ github.token }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-repo; then
            echo "::error::The wiki has no git repository yet. Create its first page once on GitHub (Wiki tab → Create the first page), then run this workflow again."
            exit 1
          fi

      - name: Copy wiki/ into it
        run: |
          find wiki-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r wiki/. wiki-repo/
          cd wiki-repo
          # Pages link to each other as Page.md so the links work on GitHub too; wiki pages have no extension.
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' *.md
          # The wiki shows the page name as its title: drop the page's own first heading.
          for page in *.md; do
            case "$page" in Home.md|_*) continue ;; esac
            sed -i '1{/^# /d}' "$page"
            sed -i '1{/^$/d}' "$page"
          done

      - name: Push
        working-directory: wiki-repo
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push

name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      play-track:
        description: Also upload the app bundle and the store listing to this Google Play track
        type: choice
        options: [none, internal, alpha, beta, production]
        default: none
      play-release-status:
        description: Google Play release status
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A version tag publishes to Google Play. A beta tag (with a suffix: v1.8.0-beta.1) goes to the PLAY_BETA_TRACK
  # repository variable's track (internal by default), a plain one (v1.8.0) to production, as PLAY_RELEASE_STATUS
  # (completed by default). A manual run publishes only when given a track.
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  IS_BETA: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
  PLAY_TRACK: ${{ startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-') && (vars.PLAY_BETA_TRACK || 'internal') || 'production') || inputs.play-track || 'none' }}
  PLAY_RELEASE_STATUS: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.PLAY_RELEASE_STATUS || 'completed') || inputs.play-release-status || 'completed' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Monotonic versionCode so each APK installs as an update over the previous one, and Play accepts each bundle.
      VERSION_CODE: ${{ github.run_number }}
    outputs:
      version-name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compute version name
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # KEY_PASSWORD may be left out: it then defaults to the keystore password (PKCS12).
            for name in KEYSTORE_PASSWORD KEY_ALIAS; do
              if [ -z "${!name}" ]; then
                echo "::error::KEYSTORE_BASE64 is set but the $name secret is missing. See README, Release signing."
                exit 1
              fi
            done
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$PLAY_TRACK" != none ]; then
            echo "::error::Google Play only accepts bundles signed with your upload key: set the KEYSTORE_BASE64 secret. See README, Release signing."
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set. The APK is signed with a throwaway debug key, so it cannot be installed over a previous build without uninstalling (which erases app data). See README."
          fi

      - name: Test and build release APK and app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mv app/build/outputs/apk/release/app-release.apk "TimeClicker-${VERSION_NAME}.apk"
          mv app/build/outputs/bundle/release/app-release.aab "TimeClicker-${VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: TimeClicker-${{ env.VERSION_NAME }}
          path: TimeClicker-*.apk
          if-no-files-found: error

      # The bundle for Google Play, with the R8 mapping that deobfuscates its crash reports.
      - uses: actions/upload-artifact@v7
        with:
          name: TimeClicker-${{ env.VERSION_NAME }}-bundle
          path: |
            TimeClicker-*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  # Release notes from the pull requests merged since the previous tag (tools/release/changelog.py).
  changelog:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # All history and tags, to find the previous tag.
          fetch-depth: 0

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/changelog.py "$GITHUB_REF_NAME" changelog

      - uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TimeClicker-${{ needs.build.outputs.version-name }}

      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: changelog

      # A beta is a pre-release; only a production release becomes the repository's latest.
      - uses: softprops/action-gh-release@v3
        with:
          files: TimeClicker-*.apk
          body_path: changelog/release-notes.md
          prerelease: ${{ env.IS_BETA }}
          make_latest: ${{ env.IS_BETA == 'false' }}

  google-play:
    # changelog is skipped on manual runs, which then upload the committed release notes.
    if: >-
      !failure() && !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.play-track != 'none'))
    needs: [build, changelog]
    runs-on: ubuntu-latest
    # Required reviewers or branch rules can be added to this environment in the repository settings.
    environment: google-play
    steps:
      # The store listing: fastlane/metadata/android, uploaded as committed (tools/store makes it).
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: TimeClicker-${{ needs.build.outputs.version-name }}-bundle
          path: bundle

      - uses: actions/download-artifact@v8
        if: env.IS_TAG == 'true'
        with:
          name: changelog
          path: changelog

      # Unless changelogs/default.txt were edited since the previous tag (then uploaded as committed), every language
      # gets the generated English notes, instead of the previous release's.
      - name: Use the generated release notes
        if: env.IS_TAG == 'true' && hashFiles('changelog/play-notes.txt') != ''
        run: |
          for dir in fastlane/metadata/android/*/; do
            mkdir -p "${dir}changelogs"
            cp changelog/play-notes.txt "${dir}changelogs/default.txt"
          done

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to Google Play
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SUPPLY_PACKAGE_NAME: dev.cfaz.timeclicker
          SUPPLY_TRACK: ${{ env.PLAY_TRACK }}
          SUPPLY_RELEASE_STATUS: ${{ env.PLAY_RELEASE_STATUS }}
          SUPPLY_METADATA_PATH: fastlane/metadata/android
          # Only images that changed since the last upload are sent again.
          SUPPLY_SYNC_IMAGE_UPLOAD: "true"
          SUPPLY_SKIP_UPLOAD_APK: "true"
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "::error::The PLAY_SERVICE_ACCOUNT_JSON secret is not set. See README, Publishing to Google Play."
            exit 1
          fi
          fastlane supply \
            --aab "bundle/TimeClicker-${{ needs.build.outputs.version-name }}.aab" \
            --mapping bundle/app/build/outputs/mapping/release/mapping.txt
